<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AbuPrestige VTU — Smart TopUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px 12px 80px 12px;
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Brand Nav */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
    }

    /* Wallet Card */
    .wallet-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%);
      color: #ffffff;
      border-radius: var(--radius-xl);
      padding: 22px 20px;
      box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.3);
      position: relative;
      overflow: hidden;
    }

    .wallet-card::before {
      content: '';
      position: absolute;
      width: 180px;
      height: 180px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      top: -40px;
      right: -40px;
    }

    .wallet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #bfdbfe;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .balance-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
    }

    .balance-val {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .wallet-account-chip {
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .copy-btn {
      background: #ffffff;
      color: #1e3a8a;
      border: none;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Action Card */
    .action-card {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      padding: 20px 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Network Switcher */
    .carrier-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .carrier-btn {
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 4px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      background: #f8fafc;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .carrier-btn.active[data-carrier="mtn"] {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #b45309;
    }
    .carrier-btn.active[data-carrier="airtel"] {
      border-color: #ef4444;
      background: #fef2f2;
      color: #b91c1c;
    }
    .carrier-btn.active[data-carrier="glo"] {
      border-color: #10b981;
      background: #ecfdf5;
      color: #047857;
    }
    .carrier-btn.active[data-carrier="9mobile"] {
      border-color: #047857;
      background: #f0fdf4;
      color: #047857;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      display: block;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: border 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    /* Purchase Button */
    .primary-btn {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px -2px rgba(37, 99, 235, 0.4);
      margin-top: 6px;
      transition: opacity 0.2s;
    }

    .primary-btn:active {
      opacity: 0.85;
    }

    /* Status Alert */
    .alert-box {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 14px;
      line-height: 1.4;
    }
    .alert-box.success {
      display: block;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }
    .alert-box.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- Top Header -->
    <div class="app-header">
      <div class="brand-title">
        AbuPrestige VTU
      </div>
      <span class="brand-badge">24/7 Automated</span>
    </div>

    <!-- Balance Card -->
    <div class="wallet-card">
      <div class="wallet-header">
        <span>Available Balance</span>
        <span onclick="fetchBalance()" style="cursor:pointer;">↻ Refresh</span>
      </div>
      <div class="balance-row">
        <span class="balance-val" id="balanceDisplay">₦5,000.00</span>
      </div>

      <div class="wallet-account-chip">
        <div>
          <div style="font-size:0.75rem; color:#bfdbfe;">Dedicated Wema Bank</div>
          <div style="font-weight:800; letter-spacing:0.5px;">8123456789</div>
        </div>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('8123456789'); alert('Wema Bank Account Number copied!');">Copy</button>
      </div>
    </div>

    <!-- Purchase Box -->
    <div class="action-card">
      <div class="section-title">
        <span>⚡</span> Buy Mobile Data
      </div>

      <!-- Carrier Tabs -->
      <div class="carrier-grid">
        <button class="carrier-btn active" data-carrier="mtn" onclick="selectCarrier('mtn')">MTN</button>
        <button class="carrier-btn" data-carrier="airtel" onclick="selectCarrier('airtel')">Airtel</button>
        <button class="carrier-btn" data-carrier="glo" onclick="selectCarrier('glo')">Glo</button>
        <button class="carrier-btn" data-carrier="9mobile" onclick="selectCarrier('9mobile')">9mobile</button>
      </div>

      <div class="form-group">
        <label class="form-label">Select Data Bundle</label>
        <select class="form-select" id="planSelect">
          <option value="mtn-sme-1gb">MTN SME 1.0 GB — ₦290 (30 Days)</option>
          <option value="mtn-sme-2gb">MTN SME 2.0 GB — ₦580 (30 Days)</option>
          <option value="mtn-sme-5gb">MTN SME 5.0 GB — ₦1,450 (30 Days)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Recipient Phone Number</label>
        <input class="form-input" id="phoneInput" type="tel" placeholder="08012345678" maxlength="11" />
      </div>

      <div class="form-group">
        <label class="form-label">Transaction PIN (Default: 1234)</label>
        <input class="form-input" id="pinInput" type="password" placeholder="••••" maxlength="4" />
      </div>

      <button class="primary-btn" id="submitBtn" onclick="handlePurchase()">Complete Purchase →</button>

      <div class="alert-box" id="statusBox"></div>
    </div>

  </div>

  <script>
    let activeCarrier = 'mtn';

    function selectCarrier(carrier) {
      activeCarrier = carrier;
      document.querySelectorAll('.carrier-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.carrier === carrier);
      });
    }

    async function fetchBalance() {
      try {
        const res = await fetch('/api/wallet');
        const data = await res.json();
        if (data.success) {
          document.getElementById('balanceDisplay').textContent = '₦' + Number(data.balance).toLocaleString('en-NG', { minimumFractionDigits: 2 });
        }
      } catch (e) {
        console.error('Wallet balance fetch error');
      }
    }

    async function handlePurchase() {
      const phone = document.getElementById('phoneInput').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      const plan = document.getElementById('planSelect').value;
      const statusBox = document.getElementById('statusBox');
      const submitBtn = document.getElementById('submitBtn');

      if (phone.length < 11) {
        setStatus('Please enter an 11-digit phone number', 'error');
        return;
      }
      if (pin.length !== 4) {
        setStatus('Please enter your 4-digit PIN', 'error');
        return;
      }

      submitBtn.textContent = 'Processing Transaction...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/vend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            network: activeCarrier,
            planOrAmount: plan,
            phone: phone,
            pin: pin
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          setStatus(`Success! ${data.message} (Ref: ${data.reference})`, 'success');
          fetchBalance();
        } else {
          setStatus(data.message || 'Transaction could not be completed.', 'error');
        }
      } catch (err) {
        setStatus('Server connection error. Please try again.', 'error');
      } finally {
        submitBtn.textContent = 'Complete Purchase →';
        submitBtn.disabled = false;
      }
    }

    function setStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.textContent = msg;
      box.className = `alert-box ${type}`;
    }

    fetchBalance();
  </script>
</body>
</html>
