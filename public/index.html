<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbuPrestige VTU - Instant Data & Airtime</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Top Navbar -->
  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-bolt text-yellow-400 text-xl"></i>
        <h1 class="font-bold text-lg tracking-wide">AbuPrestige VTU</h1>
      </div>
      <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-medium">Live</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Wallet Card -->
    <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-blue-900 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
      <div class="flex justify-between items-start mb-2">
        <div>
          <p class="text-xs text-indigo-200">Available Balance</p>
          <h2 class="text-3xl font-black tracking-tight" id="wallet-balance">₦5,000.00</h2>
        </div>
        <button onclick="refreshBalance()" class="text-indigo-200 hover:text-white text-sm bg-white/10 p-2 rounded-full">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>

      <div class="mt-4 pt-3 border-t border-indigo-700/60 flex items-center justify-between text-xs">
        <div>
          <span class="text-indigo-300">Dedicated Wema Acc:</span>
          <span class="font-mono font-semibold tracking-wider text-yellow-300"> 8123456789</span>
        </div>
        <button onclick="navigator.clipboard.writeText('8123456789'); alert('Account number copied!')" class="text-indigo-200 underline">Copy</button>
      </div>
    </div>

    <!-- Quick Purchase Box -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
      <h3 class="font-bold text-slate-800 text-sm uppercase tracking-wide flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen-button text-indigo-600"></i> Buy Mobile Data
      </h3>

      <!-- Network Selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5">Select Network</label>
        <div class="grid grid-cols-4 gap-2">
          <button type="button" onclick="selectNet('mtn')" class="net-btn border-2 border-indigo-600 bg-indigo-50 font-bold py-2 rounded-xl text-xs text-center text-indigo-900">MTN</button>
          <button type="button" onclick="selectNet('airtel')" class="net-btn border border-slate-200 font-bold py-2 rounded-xl text-xs text-center text-slate-600">Airtel</button>
          <button type="button" onclick="selectNet('glo')" class="net-btn border border-slate-200 font-bold py-2 rounded-xl text-xs text-center text-slate-600">Glo</button>
          <button type="button" onclick="selectNet('9mobile')" class="net-btn border border-slate-200 font-bold py-2 rounded-xl text-xs text-center text-slate-600">9mobile</button>
        </div>
      </div>

      <!-- Plan Selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Select Data Plan</label>
        <select id="data-plan" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-600">
          <option value="mtn-sme-1gb">MTN SME 1.0GB — ₦290 (30 Days)</option>
          <option value="mtn-sme-2gb">MTN SME 2.0GB — ₦580 (30 Days)</option>
          <option value="mtn-sme-5gb">MTN SME 5.0GB — ₦1,450 (30 Days)</option>
          <option value="mtn-cg-1gb">MTN Corporate Gifting 1GB — ₦310 (30 Days)</option>
        </select>
      </div>

      <!-- Recipient Phone -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Recipient Phone Number</label>
        <input type="tel" id="recipient-phone" placeholder="08012345678" maxlength="11" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-600" />
      </div>

      <!-- Security PIN -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Transaction PIN (Default: 1234)</label>
        <input type="password" id="user-pin" placeholder="••••" maxlength="4" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium tracking-widest text-center focus:outline-none focus:ring-2 focus:ring-indigo-600" />
      </div>

      <!-- Status Banner -->
      <div id="status-msg" class="hidden p-3 rounded-xl text-xs font-medium"></div>

      <!-- Submit Button -->
      <button onclick="processPurchase()" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2">
        <span>Complete Purchase</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>
  </main>

  <script>
    let activeNetwork = 'mtn';

    function selectNet(network) {
      activeNetwork = network;
      document.querySelectorAll('.net-btn').forEach(btn => {
        btn.className = 'net-btn border border-slate-200 font-bold py-2 rounded-xl text-xs text-center text-slate-600';
      });
      event.target.className = 'net-btn border-2 border-indigo-600 bg-indigo-50 font-bold py-2 rounded-xl text-xs text-center text-indigo-900';
    }

    async function refreshBalance() {
      try {
        const res = await fetch('/api/wallet');
        const data = await res.json();
        if (data.success) {
          document.getElementById('wallet-balance').innerText = '₦' + data.balance.toLocaleString('en-NG', { minimumFractionDigits: 2 });
        }
      } catch (err) {
        console.error('Failed to update balance', err);
      }
    }

    async function processPurchase() {
      const phone = document.getElementById('recipient-phone').value.trim();
      const pin = document.getElementById('user-pin').value.trim();
      const plan = document.getElementById('data-plan').value;
      const statusDiv = document.getElementById('status-msg');
      const submitBtn = document.getElementById('btn-submit');

      if (phone.length < 11) {
        showStatus('Please enter a valid 11-digit phone number.', 'bg-red-50 text-red-700 border border-red-200');
        return;
      }
      if (pin.length !== 4) {
        showStatus('Please enter your 4-digit PIN.', 'bg-red-50 text-red-700 border border-red-200');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

      try {
        const res = await fetch('/api/vend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'data', network: activeNetwork, planOrAmount: plan, phone, pin })
        });
        const result = await res.json();

        if (result.success) {
          showStatus(`Success! ${result.message}. Ref: ${result.reference}`, 'bg-emerald-50 text-emerald-800 border border-emerald-200');
          document.getElementById('user-pin').value = '';
          refreshBalance();
        } else {
          showStatus(result.message || 'Transaction failed', 'bg-red-50 text-red-700 border border-red-200');
        }
      } catch (err) {
        showStatus('Connection error. Server may still be booting.', 'bg-amber-50 text-amber-800 border border-amber-200');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Complete Purchase</span> <i class="fa-solid fa-arrow-right text-xs"></i>';
      }
    }

    function showStatus(msg, classes) {
      const el = document.getElementById('status-msg');
      el.className = `p-3 rounded-xl text-xs font-medium ${classes}`;
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    // Refresh balance on load
    refreshBalance();
  </script>
</body>
</html>
